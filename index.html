<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saludo Personalizado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      background: #0b1020;
      overflow: hidden;
      position: relative;
    }

    /* Fondo animado con orbes de color */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
    }
    .orb.a { width: 480px; height: 480px; background: #6366f1; top: -140px; left: -120px; animation: float1 14s ease-in-out infinite; }
    .orb.b { width: 420px; height: 420px; background: #ec4899; bottom: -160px; right: -100px; animation: float2 16s ease-in-out infinite; }
    .orb.c { width: 360px; height: 360px; background: #06b6d4; bottom: -120px; left: 30%; animation: float1 18s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-30px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,30px); } }

    /* Tarjeta glassmorphism */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.25rem;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 2rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.35), rgba(236,72,153,0.35));
      border: 1px solid rgba(255,255,255,0.2);
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }
    @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 15% { transform: rotate(16deg); } 30% { transform: rotate(-10deg); } 45% { transform: rotate(12deg); } }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #c7d2fe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0.5rem 0 2rem;
      color: rgba(226, 232, 240, 0.7);
      font-size: 0.95rem;
    }

    .field { text-align: left; margin-bottom: 1.25rem; }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(226, 232, 240, 0.75);
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      color: #fff;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(226,232,240,0.4); }
    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
    }

    button {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      background-size: 200% 200%;
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.4);
      transition: transform 0.08s, box-shadow 0.2s, background-position 0.5s;
    }
    button:hover { background-position: right center; box-shadow: 0 14px 30px rgba(139, 92, 246, 0.5); }
    button:active { transform: scale(0.98); }

    .greeting {
      margin-top: 1.75rem;
      min-height: 1.6rem;
      font-size: 1.25rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s, transform 0.4s;
    }
    .greeting.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="card">
    <div class="icon">👋</div>
    <h1>Bienvenido</h1>
    <p class="subtitle">Escribe tu nombre y te saludaremos.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">Nombre</label>
        <input id="name" type="text" placeholder="Ej. María" autocomplete="name" required>
      </div>
      <button type="submit">Saludar ✨</button>
    </form>

    <p id="greeting" class="greeting" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("name");
    const greeting = document.getElementById("greeting");

    // Saludo según la hora del día
    function saludoHora() {
      const h = new Date().getHours();
      if (h < 12) return "Buenos días";
      if (h < 19) return "Buenas tardes";
      return "Buenas noches";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = input.value.trim();

      if (!name) {
        greeting.textContent = "Por favor escribe tu nombre 🙂";
      } else {
        greeting.textContent = `${saludoHora()}, ${name}! 🎉`;
      }

      greeting.classList.remove("show");
      void greeting.offsetWidth; // reinicia la animación
      greeting.classList.add("show");
      if (!name) input.focus();
    });
  </script>
</body>
</html>
